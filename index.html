<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Style CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Google Font  POPPINS-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Google Font SilkScreen -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <title>Web Styling CSS</title>
  </head>
  <body>
    <div class="container">
      <div class="wrapper">
        <div class="card text-center">
          <h1 class="title"> LINKEDIN</h1>
          <i class="fa-brands fa-linkedin icons"></i>
          <p class="description">Rizki Rinaldi Linkedin account</p>
        </div>
        <div class="card text-center">
          <h1 class="title">GITHUB</h1>
          <i class="fa-brands fa-github icons"></i>
          <p class="description">Rizki Rinaldi Github account</p>
        </div>
        <div class="card text-center">
          <h1 class="title">DISCORD</h1>
          <i class="fa-brands fa-discord icons"></i>
          <p class="description">Rizki Rinaldi Discord Account</p>
        </div>
        <div class="card text-center">
          <h1 class="title">TIKTOK</h1>
          <i class="fa-brands fa-tiktok icons"></i>
          <p class="description">Rizki Rinaldi Tiktok Account</p>
        </div>
        <div class="card text-center">
          <h1 class="title">YOUTUBE</h1>
          <i class="fa-brands fa-youtube icons"></i>
          <p class="description">Rizki Rinaldi Youtube Account</p>
        </div>
      </div>
    </div>
  </body>
</html>
